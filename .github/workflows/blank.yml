name: Build dropbear-ARMv5

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull dockcross armv5
        run: docker pull dockcross/linux-armv5

      - name: Build Dropbear (static)
        run: |
          mkdir -p output
          docker run --rm -v "$PWD":/work -w /work dockcross/linux-armv5 bash -c '
            set -e
            cd /work
            wget -q https://matt.ucc.asn.au/dropbear/releases/dropbear-2022.83.tar.bz2
            tar xf dropbear-2022.83.tar.bz2
            cd dropbear-2022.83

            cat > localoptions.h <<EOF
            #define DROPBEAR_SVR_PASSWORD_AUTH 0
            #define DROPBEAR_SVR_PUBKEY_AUTH 1
            #define DROPBEAR_CLI_PASSWORD_AUTH 0
            #define DROPBEAR_CLI_PUBKEY_AUTH 1
            EOF

            ./configure \
              --disable-zlib \
              --disable-syslog \
              --disable-lastlog \
              --disable-utmp \
              --disable-utmpx \
              --disable-wtmp \
              --disable-wtmpx \
              --disable-shadow \
              --disable-pam

            make PROGRAMS="dropbear dbclient dropbearkey scp" STATIC=1 -j$(nproc)

            cp dropbear dbclient dropbearkey scp /work/output/
          '

      - name: Build BusyBox (static)
        run: |
          docker run --rm -v "$PWD":/work -w /work dockcross/linux-armv5 bash -c '
            set -e
            cd /work
            wget -q https://busybox.net/downloads/busybox-1.36.1.tar.bz2
            tar xf busybox-1.36.1.tar.bz2
            cd busybox-1.36.1

            make defconfig
            sed -i "s/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/" .config
            make -j$(nproc)

            cp busybox /work/output/
          '

      - name: Verify static linking
        run: |
          for f in output/*; do
            echo "===== $f ====="
            file "$f"
            if readelf -d "$f" 2>/dev/null | grep -q NEEDED; then
              echo "!! Dynamic dependency found"
              readelf -d "$f" | grep NEEDED
              exit 1
            else
              echo "OK: No external .so dependency"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-ARMv5
          path: output/*
