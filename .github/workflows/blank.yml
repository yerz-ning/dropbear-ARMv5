name: Build dropbear-ARMv5

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull dockcross armv5
        run: docker pull dockcross/linux-armv5

      - name: Clone static-cross-bins
        run: git clone https://github.com/llamasoft/static-cross-bins.git

      - name: Build Dropbear for ARMv5
        run: |
          cd static-cross-bins
          make TARGET=armv5-linux-musleabi dropbear -j$(nproc)

      - name: List output files
        run: |
          find static-cross-bins -name 'dropbear*' -o -name 'dbclient*' -o -name 'scp*' -o -name 'dropbearkey*' | head -50

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-ARMv5
          path: |
            static-cross-bins/output/
            static-cross-bins/bin/