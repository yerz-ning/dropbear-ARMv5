name: Build dropbear-ARMv5

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull dockcross armv5
        run: docker pull dockcross/linux-armv5

      - name: Download and Extract
        run: |
          wget -q https://matt.ucc.asn.au/dropbear/releases/dropbear-2022.83.tar.bz2
          tar xf dropbear-2022.83.tar.bz2

      - name: Build Dropbear with Password Auth
        run: |
          docker run --rm -v "$PWD":/work -w /work dockcross/linux-armv5 bash -c '
            set -e
            cd /work/dropbear-2022.83

            cat > localoptions.h <<EOF
            #define DROPBEAR_SVR_PASSWORD_AUTH 1
            #define DROPBEAR_SVR_PUBKEY_AUTH 1
            #define DROPBEAR_CLI_PASSWORD_AUTH 1
            #define DROPBEAR_CLI_PUBKEY_AUTH 1
            EOF

            ./configure --enable-static
            make PROGRAMS="dropbear dbclient dropbearkey scp dropbearconvert" STATIC=1 -j$(nproc)

            mkdir -p /work/output
            cp src/dropbear src/dbclient src/dropbearkey src/scp src/dropbearconvert /work/output/

            echo "===== 开始生成主机密钥 ====="
            ./dropbearkey -t rsa -s 2048 -f /work/output/dropbear_rsa_host_key
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-ARMv5
          path: output/