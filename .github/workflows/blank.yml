name: Build dropbear-ARMv5

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone static-cross-bins
        run: git clone https://github.com/llamasoft/static-cross-bins.git

      - name: Install autotools (provides config.sub)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autotools-dev
          ls -la /usr/share/misc/config.sub

      - name: Build Dropbear for ARMv5
        run: |
          set -e
          cd static-cross-bins

          echo "===== 预下载 config.sub 并放到 musl-cross-make 期望的位置 ====="
          MCMM_DIR="sources/musl-cross-make-fe91582"
          if [ ! -d "$MCMM_DIR" ]; then
            echo "找不到 musl-cross-make 目录，先解压源码"
            mkdir -p sources
            curl -L -o /tmp/mcm.tgz https://github.com/richfelker/musl-cross-make/tarball/fe91582
            mkdir -p "$MCMM_DIR.tmp"
            tar --strip-components=1 -C "$MCMM_DIR.tmp" -xf /tmp/mcm.tgz
            mv "$MCMM_DIR.tmp" "$MCMM_DIR"
          fi

          mkdir -p "$MCMM_DIR/sources"
          cp /usr/share/misc/config.sub "$MCMM_DIR/sources/config.sub"
          echo "已放置: $(ls -la $MCMM_DIR/sources/config.sub)"

          echo "===== 开始交叉编译（跳过 config.sub 下载） ====="
          make TARGET=armv5-linux-musleabi dropbear -j$(nproc)

          echo "===== 查找编译产物 ====="
          find . -type f \( -name 'dropbear' -o -name 'dbclient' -o -name 'dropbearkey' -o -name 'scp' -o -name 'dropbearconvert' \) | grep -v "\.o$"

      - name: Pack and Generate Host Key
        run: |
          set -e
          mkdir -p final_output

          echo "===== 寻找二进制文件并打包 ====="
          for bin in dropbear dbclient dropbearkey scp dropbearconvert; do
            f=$(find static-cross-bins -type f -name "$bin" | head -n 1)
            if [ -n "$f" ]; then
              cp "$f" final_output/
              echo "  [OK] $bin"
            else
              echo "  [MISS] $bin"
            fi
          done

          if [ ! -f final_output/dropbear ]; then
            echo "!!! 致命错误：没有找到 dropbear 二进制文件 !!!"
            exit 1
          fi

          chmod +x final_output/*

          echo "===== 生成主机密钥 ====="
          rm -f final_output/dropbear_rsa_host_key
          ssh-keygen -t rsa -b 3072 -f final_output/dropbear_rsa_host_key -N "" -m PEM

          echo "===== 最终文件列表 ====="
          ls -la final_output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-ARMv5
          path: final_output/